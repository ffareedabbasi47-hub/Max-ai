name: Build MAX Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: max-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Android APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Java 17
      # AGP 9.1.1 requires JDK 17
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ------------------------------------------------------------
      # Gradle 9.3.1
      # AGP 9.1.1 -> Gradle 9.3.1
      # ------------------------------------------------------------
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      # ------------------------------------------------------------
      # Environment
      # ------------------------------------------------------------
      - name: Create CI Environment File
        shell: bash
        run: |
          {
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
          } > .env

      # ------------------------------------------------------------
      # Optional debug keystore
      # ------------------------------------------------------------
      - name: Decode Debug Keystore
        shell: bash
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug keystore..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "No custom debug.keystore.base64 found."
          fi

      # ------------------------------------------------------------
      # CI-safe Gradle settings
      # Keep memory/workers conservative for GitHub runner.
      # ------------------------------------------------------------
      - name: Configure Gradle for CI
        shell: bash
        run: |
          set -e

          touch gradle.properties

          # Prevent excessive worker usage.
          if grep -q '^org.gradle.workers.max=' gradle.properties; then
            sed -i 's/^org.gradle.workers.max=.*/org.gradle.workers.max=2/' gradle.properties
          else
            echo 'org.gradle.workers.max=2' >> gradle.properties
          fi

          # Conservative heap for GitHub runner.
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8/' gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8' >> gradle.properties
          fi

          # Disable parallel project execution in CI.
          if grep -q '^org.gradle.parallel=' gradle.properties; then
            sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' gradle.properties
          else
            echo 'org.gradle.parallel=false' >> gradle.properties
          fi

          # Use Kotlin daemon instead of in-process compiler.
          if grep -q '^kotlin.compiler.execution.strategy=' gradle.properties; then
            sed -i 's/^kotlin.compiler.execution.strategy=.*/kotlin.compiler.execution.strategy=daemon/' gradle.properties
          else
            echo 'kotlin.compiler.execution.strategy=daemon' >> gradle.properties
          fi

          echo "----- CI Gradle configuration -----"
          cat gradle.properties

      # ------------------------------------------------------------
      # Verify toolchain
      # ------------------------------------------------------------
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e
          java -version
          gradle --version

      # ------------------------------------------------------------
      # Clean
      # ------------------------------------------------------------
      - name: Clean Build
        shell: bash
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ------------------------------------------------------------
      # Unit tests
      # ------------------------------------------------------------
      - name: Run Unit Tests
        shell: bash
        run: |
          gradle test \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ------------------------------------------------------------
      # Release APK
      # ------------------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          gradle assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      # ------------------------------------------------------------
      # Upload Release APK
      # ------------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-JARVIS-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # Debug APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      # ------------------------------------------------------------
      # Upload Debug APK
      # ------------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-JARVIS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # Always show useful Gradle diagnostics on failure
      # ------------------------------------------------------------
      - name: Collect Gradle diagnostics
        if: failure()
        shell: bash
        run: |
          echo "========== Java =========="
          java -version || true

          echo "========== Gradle =========="
          gradle --version || true

          echo "========== Gradle Properties =========="
          cat gradle.properties || true

          echo "========== APK Outputs =========="
          find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true

          echo "========== Build Reports =========="
          find . -path "*/build/reports/*" -type f -print 2>/dev/null | head -100 || true
