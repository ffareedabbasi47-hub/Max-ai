name: Build MAX Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create .env File
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Decode Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Apply CI-safe Gradle resource limits
        # The committed gradle.properties is tuned for a real dev machine (4 parallel workers,
        # 4GB heap, Kotlin compiled in-process) — GitHub's standard runners have far less
        # (2 CPU cores, ~7GB RAM shared with the whole job), and that mismatch was crashing
        # Gradle's worker-lease scheduler under resource pressure: the failed build executed
        # all 25 tasks with no compile-error line anywhere in the log, then failed inside
        # Gradle's own DefaultWorkerLeaseService/ExecutionRunner machinery — a resource-
        # exhaustion signature, not a code error. This only edits the CI runner's throwaway
        # checkout; the committed gradle.properties (and local dev builds) are untouched.
        run: |
          sed -i 's/org.gradle.workers.max=4/org.gradle.workers.max=2/' gradle.properties
          sed -i 's/org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8/org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/' gradle.properties
          sed -i 's/kotlin.compiler.execution.strategy=in-process/kotlin.compiler.execution.strategy=daemon/' gradle.properties
          echo "--- gradle.properties as used for this CI run ---"
          cat gradle.properties

      - name: Run Unit Tests
        run: gradle test --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-JARVIS-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-JARVIS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
